apiVersion: apps/v1
kind: Deployment

metadata:
  name: video-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: video-service

  template:
    metadata:
      labels:
        app: video-service

    spec:
      containers:
      - name: video-service
        image: video-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3002