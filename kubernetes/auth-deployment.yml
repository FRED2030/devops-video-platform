apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:

    metadata:
      labels:
        app: auth-service

    spec:

      containers:
        - name: auth-service

          image: auth-service:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 3001